# Grimoire book configuration for the @deckyard/escl documentation.

[book]
title = "@deckyard/escl"
description = "Network document scanners over eSCL (AirScan, Mopria): find them, read what they offer, scan to pages, files or PDF"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-escl/"
repoUrl = "https://github.com/deckyard/deck-escl"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-escl/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
